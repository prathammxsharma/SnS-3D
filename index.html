<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shoot N Survive | Cinematic Forest Slice</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090e0d;font-family:Georgia,serif}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none;color:#e7e5d8}.brand{position:absolute;left:clamp(16px,3vw,42px);top:clamp(14px,3vh,32px);font:600 11px/1.4 system-ui,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#d8d3c0aa}.hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);padding:10px 16px;border:1px solid #d7d1bd35;background:#0b100ebd;backdrop-filter:blur(8px);font:12px system-ui,sans-serif;letter-spacing:.06em;color:#e6e1d1d9;white-space:nowrap}.chapter{position:absolute;right:clamp(16px,3vw,42px);top:clamp(14px,3vh,32px);text-align:right;font:10px system-ui,sans-serif;letter-spacing:.2em;color:#d8d3c088;text-transform:uppercase}.chapter b{display:block;margin-top:5px;font:italic 20px Georgia,serif;letter-spacing:.02em;color:#e8e1cf}.touch{display:none;position:absolute;bottom:22px;left:18px;gap:8px;pointer-events:auto}.touch button{width:52px;height:52px;border:1px solid #ddd5bd55;background:#101714bb;color:#eee;border-radius:50%;font-size:20px}@media(max-width:700px){.touch{display:flex}.hint{bottom:90px;font-size:10px}.chapter{font-size:8px}}
</style></head>
<body><canvas id="game"></canvas><div class="hud"><div class="brand">SHOOT N SURVIVE</div><div class="chapter">FIELD TEST <b>The Quiet Forest</b></div><div class="hint">A / D or ← / → to move · SPACE to jump</div><div class="touch"><button id="left">←</button><button id="right">→</button><button id="jump">↑</button></div></div>
<script>
(()=>{const c=document.getElementById('game'),x=c.getContext('2d');let w=0,h=0,dpr=1,cam=0,keys={},p={x:120,y:0,vx:0,vy:0,on:false};const ground=()=>h*.79;function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';x.setTransform(dpr,0,0,dpr,0,0);p.y=ground()-48}addEventListener('resize',resize);resize();addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup'].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);for(const [id,k] of [['left','a'],['right','d'],['jump',' ']]){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});for(const ev of ['pointerup','pointerleave','pointercancel'])b.addEventListener(ev,()=>keys[k]=false)}
function tree(px,base,s,shade){x.fillStyle=shade;x.beginPath();x.moveTo(px,base);x.lineTo(px-s*.08,base-s*.7);x.lineTo(px-s*.35,base-s*.7);x.lineTo(px-s*.02,base-s*1.12);x.lineTo(px-s*.28,base-s*1.12);x.lineTo(px,base-s*1.65);x.lineTo(px+s*.28,base-s*1.12);x.lineTo(px+s*.02,base-s*1.12);x.lineTo(px+s*.35,base-s*.7);x.lineTo(px+s*.08,base-s*.7);x.closePath();x.fill();x.fillStyle='#171d19';x.fillRect(px-3,base-25,6,25)}
function frame(t){let dt=Math.min(.032,(t-(frame.last||t))/1000);frame.last=t;let dir=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0);p.vx+=dir*900*dt;p.vx*=Math.pow(.001,dt);p.vx=Math.max(-260,Math.min(260,p.vx));p.x+=p.vx*dt;if((keys[' ']||keys.arrowup)&&p.on){p.vy=-510;p.on=false}p.vy+=1350*dt;p.y+=p.vy*dt;if(p.y>ground()-48){p.y=ground()-48;p.vy=0;p.on=true}cam+=(p.x-w*.34-cam)*Math.min(1,dt*4);x.clearRect(0,0,w,h);let sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#17201d');sky.addColorStop(.58,'#39433a');sky.addColorStop(1,'#101714');x.fillStyle=sky;x.fillRect(0,0,w,h);let glow=x.createRadialGradient(w*.68,h*.38,0,w*.68,h*.38,h*.62);glow.addColorStop(0,'#c0b38a25');glow.addColorStop(1,'#c0b38a00');x.fillStyle=glow;x.fillRect(0,0,w,h);for(let layer=0;layer<3;layer++){let gap=180+layer*95,off=-(cam*(.12+layer*.18))%gap;for(let i=-2;i<w/gap+3;i++){let px=i*gap+off,sz=170+layer*65;x.globalAlpha=.32+layer*.2;tree(px,ground()+20,sz,['#536052','#303d34','#18231e'][layer])}}x.globalAlpha=1;x.fillStyle='#111813';x.fillRect(0,ground(),w,h-ground());x.fillStyle='#263129';for(let i=0;i<50;i++){let xx=((i*97-cam*.8)%(w+100)+w+100)%(w+100);x.fillRect(xx,ground()+8+(i%4)*7,30+(i%5)*9,2)}let sx=p.x-cam,sy=p.y;x.fillStyle='#080d0b';x.beginPath();x.ellipse(sx,ground()+3,22,5,0,0,Math.PI*2);x.fill();x.fillStyle='#1b211d';x.fillRect(sx-9,sy+23,18,25);x.fillStyle='#b4ad97';x.beginPath();x.arc(sx,sy+12,10,0,Math.PI*2);x.fill();x.strokeStyle='#b4ad97';x.lineWidth=6;x.beginPath();x.moveTo(sx-6,sy+29);x.lineTo(sx-13,sy+43);x.moveTo(sx+6,sy+29);x.lineTo(sx+13,sy+43);x.stroke();x.fillStyle='#c5c0aa';for(let i=0;i<65;i++){let rx=(i*137+t*.035)%(w+20),ry=(i*83+t*.12)%(h*.8);x.globalAlpha=.12;x.fillRect(rx,ry,1,7)}x.globalAlpha=1;requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script></body></html>
