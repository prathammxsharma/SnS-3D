part(new THREE.CapsuleGeometry(.34,.72,5,8),suit,0,1.05,0,.8,1,.55);part(new THREE.SphereGeometry(.25,12,10),skin,0,1.83,0,.88,1,.85);part(new THREE.BoxGeometry(.54,.35,.34),cloth,0,1.35,-.02);

function bindButton(id,key,jump=false){const b=document.getElementById(id),down=e=>{e.preventDefault();keys[key]=true;if(jump)jumpQueued=true},up=e=>{e.preventDefault();keys[key]=false};b.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,up))}

 const box=new THREE.Box3().setFromObject(root),height=Math.max(.001,box.max.y-box.min.y);

function addCharacterAnimations(gltf){

 for(const clip of gltf.animations||[]){const key=clip.name.toLowerCase();actions[key]=mixer.clipAction(clip)}

async function loadForestNpcs(){
 const npcSpecs=[
  {file:'police-officer-rigged.glb',x:-7,z:-17},
  {file:'soldier-rigged.glb',x:7,z:-29},
  {file:'cyborg-rigged.glb',x:-9,z:-43},
  {file:'ninja-rigged.glb',x:9,z:-56}
 ];
 window.forestNpcMixers=window.forestNpcMixers||[];
 for(const spec of npcSpecs){
  try{
   const gltf=await assetLoader.loadAsync('/models/'+spec.file);
   const npc=fitCharacter(gltf.scene,1.55);npc.position.set(spec.x,0,spec.z);scene.add(npc);
   const animation=addCharacterAnimations(gltf);
   if(animation.active)animation.active.timeScale=.65;
   window.forestNpcMixers.push(animation.mixer);
   console.info('Loaded animated forest NPC:',spec.file,gltf.animations.map(a=>a.name));
  }catch(err){console.warn('NPC model failed:',spec.file,err)}
