const groundGeo=new THREE.PlaneGeometry(240,240,90,90);groundGeo.rotateX(-Math.PI/2);const pos=groundGeo.attributes.position;for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);pos.setY(i,Math.sin(x*.18)*.12+Math.cos(z*.14)*.1+Math.sin((x+z)*.08)*.08)}groundGeo.computeVertexNormals();const ground=new THREE.Mesh(groundGeo,groundMat);ground.receiveShadow=true;scene.add(ground);

for(let i=0;i<155;i++){let side=rand()<.5?-1:1;let x=side*(7+rand()*68),z=25-rand()*190;makeTree(x,z,.75+rand()*1.45)}
const rockGeo=new THREE.DodecahedronGeometry(1,0),rockMat=mat(0x626657);for(let i=0;i<65;i++){const r=new THREE.Mesh(rockGeo,rockMat);const a=rand()*Math.PI*2,rad=5+rand()*62;r.position.set(Math.cos(a)*rad,.15+rand()*.35,12-rand()*180);r.scale.set(.25+rand()*1.1,.2+rand()*.65,.3+rand());r.rotation.set(rand(),rand()*3,rand());r.castShadow=true;r.receiveShadow=true;scene.add(r)}

part(new THREE.CapsuleGeometry(.34,.72,5,8),suit,0,1.05,0,.8,1,.55);
part(new THREE.SphereGeometry(.25,12,10),skin,0,1.83,0,.88,1,.85);

function bindButton(id,key,jump=false){const b=document.getElementById(id);const down=e=>{e.preventDefault();keys[key]=true;if(jump)jumpQueued=true};const up=e=>{e.preventDefault();keys[key]=false};b.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,up))}
